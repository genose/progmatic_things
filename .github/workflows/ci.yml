name: CI

on:
  push:
    paths:
      - "C.Sharp.Net/**"
      - "COBOL/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "C.Sharp.Net/**"
      - "COBOL/**"
      - ".github/workflows/ci.yml"

jobs:
  dotnet-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 7 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"

      - name: Restore solution
        run: dotnet restore C.Sharp.Net/progmatic_things_CSharp.sln

      - name: Build solution
        run: dotnet build C.Sharp.Net/progmatic_things_CSharp.sln -c Release --no-restore

  cobol-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol

      - name: Compile basics
        run: |
          mkdir -p COBOL/bin
          for f in COBOL/basics/*.cbl; do
            name=$(basename "$f" .cbl)
            cobc -x -o "COBOL/bin/$name" "$f"
          done

      - name: Compile strings
        run: |
          for f in COBOL/strings/*.cbl; do
            name=$(basename "$f" .cbl)
            cobc -x -o "COBOL/bin/$name" "$f"
          done

      - name: Compile arrays
        run: |
          for f in COBOL/arrays/*.cbl; do
            name=$(basename "$f" .cbl)
            cobc -x -o "COBOL/bin/$name" "$f"
          done

      - name: Compile games
        run: |
          for f in COBOL/games/*.cbl; do
            name=$(basename "$f" .cbl)
            cobc -x -o "COBOL/bin/$name" "$f"
          done

      - name: Compile files
        run: |
          for f in COBOL/files/*.cbl; do
            name=$(basename "$f" .cbl)
            cobc -x -o "COBOL/bin/$name" "$f"
          done

      - name: Compile studies
        run: |
          for f in COBOL/studies/*.cbl; do
            name=$(basename "$f" .cbl)
            cobc -x -o "COBOL/bin/$name" "$f"
          done
