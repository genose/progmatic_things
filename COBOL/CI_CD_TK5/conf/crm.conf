# ============================================================
# conf/crm.conf — Configuration projet CRM
# Auteur   : Sebastien Cotillard
# Date     : 2026-09-02
#
# Projet : CRM Batch COBOL (OpenVMS/GnuCOBOL), sans CICS
# 4 sources, pas de copybooks, pas de BMS
# ============================================================

PROJECT_LABEL="CRM — Gestion Client Batch"
APP_SUFFIX="CRM"
PROJECT_DIR="${CI_DIR}/../CRM"

# ------ Sources COBOL ----------------------------------------
# Pas de pattern glob : liste explicite "fichier_relatif:MEMBRE_MVS"
CBL_PATTERN=""
CBL_FILES=(
    "D05_VERIF_CRM.SCO:D05VERIF"
    "T10_MAJ_DTLIVR_BDCRM.COB:T10MAJDT"
    "D02_EXTCDE_CRMCSP1.COB:D02EXTCD"
    "D05_INTCDEFAC_CRM_V2.SCO:D05INTCD"
)

# Pas de copybooks
COPYBOOK_FILES=()

# ------ BMS (aucun — projet batch) ---------------------------
BMS_PATTERN=""
BMS_FILES=()

# ------ Extensions surveillées (07_watch.sh) -----------------
WATCH_EXTENSIONS=(COB SCO cob sco)

# ------ Noms de jobs JES2 (max 8 chars) ----------------------
JCL_ALLOC_JOBNAME="CRMALLOC"
JCL_UPLOAD_CBL_JOBNAME="CRMUSR"
JCL_UPLOAD_BMS_JOBNAME=""
JCL_UPLOAD_CPY_JOBNAME=""
JCL_UPLOAD_JCL_JOBNAME="CRMUJCL"
JCL_BMS_JOBNAME=""
JCL_COMP_JOBNAME="CRMCOMP"

# ------ Fichiers JCL locaux ----------------------------------
JCL_ALLOC_FILE="${CI_DIR}/mvs/00_alloc.jcl"
JCL_BMS_FILE=""
JCL_COMP_FILE=""
JCL_BMS_MEMBER=""
JCL_COMP_MEMBER=""

# ------ CICS (aucun — projet batch) -------------------------
HAS_CICS=0
CICS_GROUP=""
CICS_MAPSETS=()
CICS_PROGRAMS=()
CICS_TRANSACTIONS=()
CICS_TESTS_FILE=""

# ------ Validation locale avant MVS --------------------------
CHECK_COBOL_CMD="bash ${CI_DIR}/../CRM/scripts/01_cobc_check.sh"
CHECK_UNIT_CMD="cd ${CI_DIR}/../CRM/crm-java && mvn test -q"

# ------ Overrides MVS : délégation aux scripts CRM -----------
MVS_UPLOAD_CMD="bash ${CI_DIR}/../CRM/scripts/mvs/01_upload.sh"
MVS_COMPILE_CMD="bash ${CI_DIR}/../CRM/scripts/mvs/02_compile.sh compile"
