# ============================================================
# conf/gstk.conf — Configuration projet GSTK
# Auteur   : Sebastien Cotillard
# Date     : 2026-09-02
#
# Projet : Gestion de Stock CICS/COBOL sur MVS TK5 (KICKS)
# ============================================================

PROJECT_LABEL="GSTK — Gestion de Stock CICS"
APP_SUFFIX="GSTK"
PROJECT_DIR="${CI_DIR}/../GSTK"

# ------ Sources COBOL ----------------------------------------
# Pattern glob relatif à PROJECT_DIR
CBL_PATTERN="GSTK00*.cbl"
CBL_FILES=()

# Copybooks : tableau "fichier_relatif:MEMBRE_MVS"
COPYBOOK_FILES=("Copybook.cbl:GSTKCOMM")

# ------ BMS --------------------------------------------------
BMS_PATTERN="GSTK00*M.bms"
BMS_FILES=()

# ------ Extensions surveillées (07_watch.sh) -----------------
WATCH_EXTENSIONS=(cbl bms cpy)

# ------ Noms de jobs JES2 (max 8 chars) ----------------------
JCL_ALLOC_JOBNAME="GSTKALLC"
JCL_UPLOAD_CBL_JOBNAME="GSTKUSR"
JCL_UPLOAD_BMS_JOBNAME="GSTKUBM"
JCL_UPLOAD_CPY_JOBNAME="GSTKUCP"
JCL_UPLOAD_JCL_JOBNAME="GSTKUJC"
JCL_BMS_JOBNAME="GSTKBMS"
JCL_COMP_JOBNAME="GSTKCOMP"

# ------ Fichiers JCL locaux ----------------------------------
JCL_ALLOC_FILE="${CI_DIR}/mvs/00_alloc.jcl"
JCL_BMS_FILE="${CI_DIR}/jcl/GSTKBMS.jcl"
JCL_COMP_FILE="${CI_DIR}/jcl/GSTKCOMP.jcl"
JCL_BMS_MEMBER="GSTKBMS"
JCL_COMP_MEMBER="GSTKCOMP"

# ------ CICS -------------------------------------------------
HAS_CICS=1
CICS_BACKEND=kicks   # GSTK conçu pour KICKS ; changer en cicsvs ou both si CICS/VS installé
CICS_GROUP="GSTK"
CICS_MAPSETS=(GSTK000M GSTK001M GSTK002M GSTK003M GSTK004M GSTK005M GSTK006M GSTK007M)
CICS_PROGRAMS=(GSTK000 GSTK001 GSTK002 GSTK003 GSTK004 GSTK005 GSTK006 GSTK007)
CICS_TRANSACTIONS=(G000 G001 G002 G003 G004 G005 G006 G007)
CICS_TESTS_FILE="${CI_DIR}/conf/gstk_cics_tests.sh"

# ------ Validation locale avant MVS --------------------------
CHECK_COBOL_CMD="bash ${CI_DIR}/../GSTK/scripts/04_cobc_check.sh"
CHECK_UNIT_CMD="bash ${CI_DIR}/../GSTK/scripts/05_test_sql.sh"

# ------ Overrides MVS (vide = comportement générique) --------
MVS_UPLOAD_CMD=""
MVS_COMPILE_CMD=""
